name: flomo connectivity test (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe flomo API
        run: |
          curl -sS -o /dev/null -w "api %{http_code} %{remote_ip} %{time_total}s\n" --max-time 20 https://flomoapp.com/api/v1/user/me || echo "api FAILED"
          curl -sS -o /dev/null -w "web %{http_code} %{remote_ip} %{time_total}s\n" --max-time 20 https://v.flomoapp.com/ || echo "web FAILED"
          curl -sS https://ipinfo.io/json | head -8 || true
