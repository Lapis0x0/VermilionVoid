name: Sync Content from COS

on:
  schedule:
    - cron: '0 */12 * * *'  # 每 12 小时兜底；日常急用走手动触发
  workflow_dispatch:

concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync thoughts from COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_PREFIX: ${{ secrets.COS_PREFIX }}
        run: pnpm sync-thoughts

      - name: Sync studies from COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_PREFIX: ${{ secrets.COS_STUDIES_PREFIX || '1.专题/' }}
        run: pnpm sync-studies

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/content/thoughts src/content/studies
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync content from Obsidian [skip ci]"
            git push
          fi
